name: Chat event runtime CI
on:
  push:
    branches: [feature/chat-event-runtime-v1]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q server.py agent_tools.py chat tests
      - name: Conversation store tests
        run: python -m unittest tests.test_conversation_store -v
