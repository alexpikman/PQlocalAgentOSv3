<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Тесты · PQlocalAgentOSv3</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f6f7f9; color: #1a1a1a; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
  button { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer;
           background: #2b6cb0; color: #fff; font-size: 14px; font-weight: 600; }
  button:disabled { background: #a0aec0; cursor: not-allowed; }
  .status { font-size: 14px; color: #4a5568; }
  .status.ok { color: #2f855a; font-weight: 600; }
  .status.fail { color: #c53030; font-weight: 600; }
  pre { background: #1a202c; color: #e2e8f0; padding: 16px; border-radius: 8px;
        overflow: auto; font-size: 12px; line-height: 1.5; max-height: 70vh; }
  .summary { display: flex; gap: 16px; margin-bottom: 12px; font-size: 13px; }
  .summary span { background: #edf2f7; padding: 4px 10px; border-radius: 6px; }
</style>
</head>
<body>
  <h1>Запуск тестов</h1>
  <div class="toolbar">
    <button id="run">Запустить тесты</button>
    <span class="status" id="status">Готов к запуску</span>
  </div>
  <div class="summary" id="summary"></div>
  <pre id="output">Нажмите «Запустить тесты», чтобы увидеть результат.</pre>
  <script src="/tests.js"></script>
</body>
</html>
